[project]
name = "jevdevice"
version = "0.1.0"
description = "Android device automation over MCP: a typed judge engine picks one gated atomic action per goal, grounded in live screen state."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "mcp>=1.0,<2",
    "uiautomator2>=3.7.0",
    "adbutils[apk]>=2.12.0",
    "laya>=0.3.3",
    "transformers>=4.48",
]

[project.scripts]
jevdevice-mcp = "jevdevice.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevdevice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
norecursedirs = ["experiment"]
