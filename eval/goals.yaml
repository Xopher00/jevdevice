# Frozen 2026-09-19, before any engine code existed. Plain-language goals only, no commands.
# split: dev = may be run and inspected during development.
#        heldout = run once at M6, cold then warm, no changes between seeing results and reporting.
# Do not edit goal text after freezing. Add new goals with new ids instead.

pc_questions:
  - {id: pc01, split: dev,     goal: "What is the CPU temperature right now?"}
  - {id: pc02, split: heldout, goal: "How much free disk space is left on the root filesystem?"}
  - {id: pc03, split: dev,     goal: "Which process is using the most memory?"}
  - {id: pc04, split: heldout, goal: "What is this machine's local IP address on wifi?"}
  - {id: pc05, split: dev,     goal: "Is the SSH server running?"}
  - {id: pc06, split: heldout, goal: "How long has this machine been up?"}
  - {id: pc07, split: dev,     goal: "What kernel version is running?"}
  - {id: pc08, split: heldout, goal: "How much RAM is installed and how much of it is free?"}
  - {id: pc09, split: dev,     goal: "What is the battery charge percentage?"}
  - {id: pc10, split: heldout, goal: "Which wifi network is this machine connected to?"}
  - {id: pc11, split: dev,     goal: "How many CPU cores does this machine have?"}
  - {id: pc12, split: heldout, goal: "What is the default gateway?"}
  - {id: pc13, split: dev,     goal: "Which DNS servers are configured?"}
  - {id: pc14, split: heldout, goal: "Is Docker running?"}
  - {id: pc15, split: dev,     goal: "What GPU does this machine have?"}
  - {id: pc16, split: heldout, goal: "What is the hostname?"}
  - {id: pc17, split: dev,     goal: "Which users are currently logged in?"}
  - {id: pc18, split: heldout, goal: "What is the current screen resolution?"}
  - {id: pc19, split: dev,     goal: "Which ports are listening for connections?"}
  - {id: pc20, split: heldout, goal: "What Linux distribution and version is this?"}

